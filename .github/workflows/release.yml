name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (defaults to ref name)'
        required: false

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache native components
        id: cache-native
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/
            app/src/main/assets/
          key: native-${{ hashFiles('Dockerfile', 'build-rootfs/**', 'podroid-bridge.c', 'podroid-launcher.c', 'build-all.sh', 'gradle.properties', 'podroid_kernel.config') }}

      - name: Set up QEMU
        if: steps.cache-native.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build native components
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          ./build-all.sh initramfs
          ./build-all.sh rootfs
          ./build-all.sh qemu

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-bins
          path: app/src/main/
          retention-days: 1

  build-apk:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-bins
          path: app/src/main/

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
